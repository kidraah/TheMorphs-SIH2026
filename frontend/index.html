<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Driven Hyper-Local Early Warning System | India Meteorological Department</title>
    <meta name="description" content="Nowcasting for Severe Thunderstorm, Cloudburst & Flash Flood - India Meteorological Department, Ministry of Earth Sciences, Government of India" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-[#F4F6F9] text-slate-800 antialiased font-sans m-0 p-0 selection:bg-blue-100 selection:text-blue-900">
    <script>
      window.addEventListener('error', function(event) {
        const errorMsg = document.createElement('div');
        errorMsg.style = 'color: red; background: white; padding: 20px; font-family: monospace; white-space: pre-wrap; position: absolute; z-index: 99999; width: 100vw; height: 100vh; overflow: auto;';
        errorMsg.innerText = 'RUNTIME ERROR:\n' + (event.error ? event.error.stack : event.message);
        document.body.prepend(errorMsg);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
