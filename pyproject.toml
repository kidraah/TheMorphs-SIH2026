[project]
name = "nowcast-eval"
version = "0.1.0"
description = "Scoring harness for severe-weather nowcasts (thunderstorm / cloudburst / flash flood)"
requires-python = ">=3.10"
# torch is NOT a base dependency. The ingest/download host does not need it,
# and not installing it there removes the pykdtree/torch OpenMP conflict
# entirely rather than working around it. matplotlib likewise: only
# nowcast_eval.plots imports it, and a headless fetch box has nothing to plot.
dependencies = ["numpy>=1.24", "scipy>=1.10", "h5py>=3.8", "pandas>=2.0"]

# satpy + pyresample are needed only for the Indian ingestion path
[project.optional-dependencies]
model = ["torch>=2.2"]                       # training and inference hosts
baselines = ["pysteps>=1.7"]
# The fetch/ingest host: no torch, no matplotlib.
ingest = ["satpy>=0.50", "pyresample>=1.28", "h5netcdf>=1.3",
          "requests>=2.31", "fsspec>=2024.2", "aiohttp>=3.9"]
era5 = ["xarray>=2024.1", "zarr>=2.16", "gcsfs>=2024.2"]
flood = ["rasterio>=1.3", "pyproj>=3.6"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7", "pytest-timeout>=2.2", "nowcast-eval[model,ingest,era5,flood,viz]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nowcast_eval", "nowcast_data", "nowcast_model", "nowcast_train", "nowcast_serve", "nowcast_flood", "nowcast_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The VIL decode warning is deliberate and asserted by test_unverified_vil_decode_warns;
# silenced elsewhere so it does not drown the run.
filterwarnings = ["ignore:channel 'vil' has an unverified decode"]

# A hanging test must FAIL, not block. One subprocess test that binds a local
# server waited on something that never arrived and cost 25 minutes of wall
# clock while telling us nothing -- the worst possible outcome, because an
# indefinite block is not even a signal. 300 s is generous: the slowest
# legitimate test (real INSAT ingest plus a torch forward) runs in ~30 s.
#
# "thread" method, not "signal": the signal method cannot interrupt a
# blocking read inside subprocess/socket, which is exactly what hung.
timeout = 300
timeout_method = "thread"
