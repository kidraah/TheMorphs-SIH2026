[project]
name = "nowcast-eval"
version = "0.1.0"
description = "Scoring harness for severe-weather nowcasts (thunderstorm / cloudburst / flash flood)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
baselines = ["pysteps>=1.7"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nowcast_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
